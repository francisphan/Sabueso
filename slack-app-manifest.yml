display_information:
  name: Sabueso
  description: Guest intelligence approval bot for The Vines of Mendoza. Reviews AI-researched guest profiles and writes approved data to Salesforce.
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: Sabueso
    always_online: true

oauth_config:
  scopes:
    bot:
      - chat:write

settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
